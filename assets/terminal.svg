<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>

    <linearGradient id="termHeaderBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0f141c"/>
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="cursorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .title-bar { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #8b949e; }
    .prompt { fill: #00d4ff; font-weight: 600; font-size: 13.5px; }
    .cmd { fill: #f0f6fc; font-size: 13.5px; }
    .out { fill: #c9d1d9; font-size: 13px; }
    .accent { fill: #3b82f6; }
    .highlight { fill: #a855f7; font-weight: 600; }
    .success { fill: #10b981; }

    @media (prefers-reduced-motion: reduce) {
      .term-anim { opacity: 1 !important; }
      .cursor-blink { opacity: 1 !important; }
    }
  </style>

  <!-- Terminal Window Shadow & Frame -->
  <rect x="4" y="4" width="842" height="322" rx="12" fill="url(#termBg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <path d="M 4 16 C 4 9.37 9.37 4 16 4 L 834 4 C 840.63 4 846 9.37 846 16 L 846 36 L 4 36 Z" fill="url(#termHeaderBg)"/>
  <line x1="4" y1="36" x2="846" y2="36" stroke="#30363d" stroke-width="1"/>

  <!-- Window Controls (Red, Yellow, Green macOS buttons) -->
  <circle cx="24" cy="20" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="5.5" fill="#ffbd2e"/>
  <circle cx="60" cy="20" r="5.5" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="425" y="24" text-anchor="middle" class="title-bar">aditya@portfolio:~ (zsh)</text>

  <!-- Content Line 1: whoami -->
  <g class="term-anim" opacity="1">
    <text x="24" y="70" class="font-mono prompt">aditya<tspan fill="#8b949e">@</tspan><tspan fill="#a855f7">devbox</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#3b82f6">~</tspan><tspan fill="#f0f6fc">$</tspan> <tspan class="cmd">whoami</tspan></text>
  </g>

  <!-- Output 1 -->
  <g class="term-anim">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1;0.15;1" dur="10s" repeatCount="indefinite"/>
    <text x="24" y="98" class="font-mono out">
      <tspan class="accent">➔</tspan> <tspan font-weight="600" fill="#ffffff">Aditya Patil</tspan> <tspan fill="#8b949e">|</tspan> Full-Stack Developer <tspan fill="#00d4ff">•</tspan> AI/ML Enthusiast <tspan fill="#00d4ff">•</tspan> Agentic AI Explorer
    </text>
  </g>

  <!-- Content Line 2: cat focus.txt -->
  <g class="term-anim">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.25;0.3;1" dur="10s" repeatCount="indefinite"/>
    <text x="24" y="136" class="font-mono prompt">aditya<tspan fill="#8b949e">@</tspan><tspan fill="#a855f7">devbox</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#3b82f6">~</tspan><tspan fill="#f0f6fc">$</tspan> <tspan class="cmd">cat focus.txt</tspan></text>
  </g>

  <!-- Output 2 -->
  <g class="term-anim">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.35;0.4;1" dur="10s" repeatCount="indefinite"/>
    <text x="24" y="164" class="font-mono out">
      <tspan class="accent">➔</tspan> Agentic AI &amp; LLM Systems <tspan fill="#8b949e">|</tspan> MERN &amp; .NET Full-Stack <tspan fill="#8b949e">|</tspan> Python AST Tooling &amp; Cloud Infra
    </text>
  </g>

  <!-- Content Line 3: cat education.json -->
  <g class="term-anim">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.55;1" dur="10s" repeatCount="indefinite"/>
    <text x="24" y="202" class="font-mono prompt">aditya<tspan fill="#8b949e">@</tspan><tspan fill="#a855f7">devbox</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#3b82f6">~</tspan><tspan fill="#f0f6fc">$</tspan> <tspan class="cmd">./check-status.sh --verbose</tspan></text>
  </g>

  <!-- Output 3 -->
  <g class="term-anim">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.65;1" dur="10s" repeatCount="indefinite"/>
    <text x="24" y="230" class="font-mono out">
      <tspan class="success">[✓]</tspan> <tspan fill="#f0f6fc">B.Tech CSE @ DYPATU</tspan> <tspan fill="#8b949e">(Expected 2028)</tspan> <tspan fill="#8b949e">•</tspan> <tspan class="success">[✓]</tspan> <tspan fill="#f0f6fc">Diploma in Comp Engg</tspan> <tspan fill="#8b949e">(Completed)</tspan>
    </text>
    <text x="24" y="254" class="font-mono out">
      <tspan class="accent">➔</tspan> <tspan fill="#00d4ff">Active Goal:</tspan> Crafting scalable AI agents &amp; production-grade architectures.
    </text>
  </g>

  <!-- Active Command Line with blinking cursor -->
  <g class="term-anim">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.8;1" dur="10s" repeatCount="indefinite"/>
    <text x="24" y="292" class="font-mono prompt">aditya<tspan fill="#8b949e">@</tspan><tspan fill="#a855f7">devbox</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#3b82f6">~</tspan><tspan fill="#f0f6fc">$</tspan> <tspan fill="#8b949e">ready_to_collaborate --now</tspan></text>
    <!-- Blinking Cursor -->
    <rect x="330" y="280" width="9" height="15" fill="#00d4ff" class="cursor-blink" filter="url(#cursorGlow)">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

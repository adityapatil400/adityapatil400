<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 56" width="100%" height="56">
  <defs>
    <linearGradient id="bgBack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>
  </defs>

  <style>
    .font-mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 12px; font-weight: 600; }
    .cat-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #a855f7; }
    .chip-rect { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .chip-txt { fill: #f0f6fc; }

    @media (prefers-reduced-motion: reduce) {
      .chip-anim { opacity: 1 !important; }
    }
  </style>

  <rect x="2" y="2" width="846" height="52" rx="10" fill="url(#bgBack)" stroke="#30363d" stroke-width="1"/>

  <!-- Category Label -->
  <text x="20" y="32" class="cat-title">⚙️ Backend</text>
  <line x1="145" y1="12" x2="145" y2="44" stroke="#30363d" stroke-width="1"/>

  <!-- Chips -->
  <g transform="translate(165, 12)">
    <!-- Node.js -->
    <g transform="translate(0, 0)" class="chip-anim">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" begin="0.1s"/>
      <rect width="95" height="32" rx="16" class="chip-rect" stroke="#10b981"/>
      <circle cx="16" cy="16" r="3.5" fill="#10b981"/>
      <text x="28" y="20" class="font-mono chip-txt">Node.js</text>
    </g>

    <!-- Express.js -->
    <g transform="translate(105, 0)" class="chip-anim">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" begin="0.3s"/>
      <rect width="110" height="32" rx="16" class="chip-rect"/>
      <circle cx="16" cy="16" r="3.5" fill="#ffffff"/>
      <text x="28" y="20" class="font-mono chip-txt">Express.js</text>
    </g>

    <!-- FastAPI -->
    <g transform="translate(225, 0)" class="chip-anim">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" begin="0.5s"/>
      <rect width="95" height="32" rx="16" class="chip-rect" stroke="#00d4ff"/>
      <circle cx="16" cy="16" r="3.5" fill="#00d4ff"/>
      <text x="28" y="20" class="font-mono chip-txt">FastAPI</text>
    </g>

    <!-- .NET -->
    <g transform="translate(330, 0)" class="chip-anim">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" begin="0.7s"/>
      <rect width="80" height="32" rx="16" class="chip-rect" stroke="#a855f7"/>
      <circle cx="16" cy="16" r="3.5" fill="#a855f7"/>
      <text x="28" y="20" class="font-mono chip-txt">.NET</text>
    </g>

    <!-- ASP.NET -->
    <g transform="translate(420, 0)" class="chip-anim">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" begin="0.9s"/>
      <rect width="100" height="32" rx="16" class="chip-rect"/>
      <circle cx="16" cy="16" r="3.5" fill="#3b82f6"/>
      <text x="28" y="20" class="font-mono chip-txt">ASP.NET</text>
    </g>

    <!-- Flask -->
    <g transform="translate(530, 0)" class="chip-anim">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" begin="1.1s"/>
      <rect width="80" height="32" rx="16" class="chip-rect"/>
      <circle cx="16" cy="16" r="3.5" fill="#00d4ff"/>
      <text x="28" y="20" class="font-mono chip-txt">Flask</text>
    </g>
  </g>
</svg>

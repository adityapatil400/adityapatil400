<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 46" width="210" height="46">
  <defs>
    <linearGradient id="btnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="btnBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Shimmer Sweep -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="btnClip">
      <rect x="2" y="2" width="206" height="42" rx="21"/>
    </clipPath>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    @media (prefers-reduced-motion: reduce) {
      .shimmer-sweep { display: none; }
    }
  </style>

  <!-- Button Background & Border -->
  <rect x="2" y="2" width="206" height="42" rx="21" fill="url(#btnBg)" stroke="url(#btnBorder)" stroke-width="1.5"/>

  <!-- Shimmer Sweep Animation -->
  <g clip-path="url(#btnClip)">
    <rect x="-100" y="0" width="80" height="46" fill="url(#shimmer)" transform="skewX(-25)" class="shimmer-sweep">
      <animate attributeName="x" values="-100;300" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- GitHub Invertocat Icon (Vector) -->
  <path fill="#f0f6fc" d="M 32 14 C 26.48 14 22 18.48 22 24 C 22 28.42 24.87 32.17 28.84 33.49 C 29.34 33.58 29.52 33.27 29.52 33.01 C 29.52 32.78 29.51 32.02 29.51 31.21 C 26.73 31.82 26.14 30.01 26.14 30.01 C 25.68 28.86 25.03 28.55 25.03 28.55 C 24.12 27.93 25.1 27.94 25.1 27.94 C 26.1 28.01 26.63 28.97 26.63 28.97 C 27.52 30.5 28.97 30.06 29.54 29.8 C 29.63 29.15 29.89 28.71 30.17 28.46 C 27.95 28.21 25.62 27.35 25.62 23.52 C 25.62 22.43 26.01 21.54 26.65 20.84 C 26.55 20.59 26.21 19.57 26.75 18.2 C 26.75 18.2 27.59 17.93 29.49 19.22 C 30.29 19 31.14 18.89 31.99 18.89 C 32.84 18.89 33.69 19 34.49 19.22 C 36.39 17.93 37.23 18.2 37.23 18.2 C 37.77 19.57 37.43 20.59 37.33 20.84 C 37.97 21.54 38.36 22.43 38.36 23.52 C 38.36 27.36 36.02 28.2 33.79 28.45 C 34.15 28.76 34.47 29.37 34.47 30.31 C 34.47 31.65 34.46 32.73 34.46 33.01 C 34.46 33.28 34.64 33.59 35.15 33.49 C 39.12 32.16 42 28.42 42 24 C 42 18.48 37.52 14 32 14 Z"/>

  <!-- Button Label -->
  <text x="54" y="28" fill="#ffffff" font-size="13.5" font-weight="600" class="font-sans">GitHub Profile</text>
  <text x="180" y="27" fill="#00d4ff" font-size="13" class="font-sans">→</text>
</svg>

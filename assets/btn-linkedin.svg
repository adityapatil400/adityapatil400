<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 46" width="210" height="46">
  <defs>
    <linearGradient id="btnBgLi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="btnBorderLi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077b5"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>

    <!-- Shimmer Sweep -->
    <linearGradient id="shimmerLi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="btnClipLi">
      <rect x="2" y="2" width="206" height="42" rx="21"/>
    </clipPath>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    @media (prefers-reduced-motion: reduce) {
      .shimmer-sweep { display: none; }
    }
  </style>

  <!-- Button Background & Border -->
  <rect x="2" y="2" width="206" height="42" rx="21" fill="url(#btnBgLi)" stroke="url(#btnBorderLi)" stroke-width="1.5"/>

  <!-- Shimmer Sweep Animation -->
  <g clip-path="url(#btnClipLi)">
    <rect x="-100" y="0" width="80" height="46" fill="url(#shimmerLi)" transform="skewX(-25)" class="shimmer-sweep">
      <animate attributeName="x" values="-100;300" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    </rect>
  </g>

  <!-- LinkedIn Vector Icon -->
  <g transform="translate(22, 13)">
    <rect width="20" height="20" rx="3" fill="#0077b5"/>
    <path fill="#ffffff" d="M 4.5 7.5 H 7 V 15.5 H 4.5 Z M 5.75 4.2 C 4.95 4.2 4.3 4.85 4.3 5.65 C 4.3 6.45 4.95 7.1 5.75 7.1 C 6.55 7.1 7.2 6.45 7.2 5.65 C 7.2 4.85 6.55 4.2 5.75 4.2 Z M 8.5 7.5 H 10.9 V 8.6 H 10.95 C 11.3 7.95 12.1 7.25 13.4 7.25 C 16 7.25 16.5 8.95 16.5 11.2 V 15.5 H 14 V 11.6 C 14 10.65 13.98 9.4 12.7 9.4 C 11.4 9.4 11.2 10.4 11.2 11.5 V 15.5 H 8.5 Z"/>
  </g>

  <!-- Button Label -->
  <text x="54" y="28" fill="#ffffff" font-size="13.5" font-weight="600" class="font-sans">LinkedIn Connect</text>
  <text x="180" y="27" fill="#00d4ff" font-size="13" class="font-sans">→</text>
</svg>

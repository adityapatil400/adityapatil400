<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 56" width="100%" height="56">
  <defs>
    <linearGradient id="marqBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>

    <!-- Edge Fade Mask -->
    <linearGradient id="edgeFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="5%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="95%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <mask id="fadeMask">
      <rect x="0" y="0" width="850" height="56" fill="url(#edgeFade)"/>
    </mask>
  </defs>

  <style>
    .font-mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 11.5px; font-weight: 600; }
    .chip-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .chip-text { fill: #c9d1d9; }
    .dot-cyan { fill: #00d4ff; }
    .dot-blue { fill: #3b82f6; }
    .dot-purple { fill: #a855f7; }

    @media (prefers-reduced-motion: reduce) {
      .marquee-group { animation: none !important; }
    }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="846" height="52" rx="10" fill="url(#marqBg)" stroke="#30363d" stroke-width="1"/>

  <g mask="url(#fadeMask)">
    <!-- Animated Scrolling Track -->
    <g class="marquee-group">
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="-1200 0"
        dur="25s"
        repeatCount="indefinite"/>

      <!-- Set 1 (Width ~ 1200) -->
      <g transform="translate(10, 13)">
        <!-- Chip 1 -->
        <g transform="translate(0, 0)">
          <rect width="105" height="30" rx="15" class="chip-bg"/>
          <circle cx="16" cy="15" r="3.5" class="dot-cyan"/>
          <text x="30" y="19" class="font-mono chip-text">Python</text>
        </g>
        <!-- Chip 2 -->
        <g transform="translate(115, 0)">
          <rect width="95" height="30" rx="15" class="chip-bg"/>
          <circle cx="16" cy="15" r="3.5" class="dot-blue"/>
          <text x="30" y="19" class="font-mono chip-text">React</text>
        </g>
        <!-- Chip 3 -->
        <g transform="translate(220, 0)">
          <rect width="130" height="30" rx="15" class="chip-bg"/>
          <circle cx="16" cy="15" r="3.5" class="dot-purple"/>
          <text x="30" y="19" class="font-mono chip-text">Agentic AI</text>
        </g>
        <!-- Chip 4 -->
        <g transform="translate(360, 0)">
          <rect width="105" height="30" rx="15" class="chip-bg"/>
          <circle cx="16" cy="15" r="3.5" class="dot-cyan"/>
          <text x="30" y="19" class="font-mono chip-text">FastAPI</text>
        </g>
        <!-- Chip 5 -->
        <g transform="translate(475, 0)">
          <rect width="100" height="30" rx="15" class="chip-bg"/>
          <circle cx="16" cy="15" r="3.5" class="dot-blue"/>
          <text x="30" y="19" class="font-mono chip-text">.NET Core</text>
        </g>
        <!-- Chip 6 -->
        <g transform="translate(585, 0)">
          <rect width="110" height="30" rx="15" class="chip-bg"/>
          <circle cx="16" cy="15" r="3.5" class="dot-purple"/>
          <text x="30" y="19" class="font-mono chip-text">PyTorch</text>
        </g>
        <!-- Chip 7 -->
        <g transform="translate(705, 0)">
          <rect width="105" height="30" rx="15" class="chip-bg"/>
          <circle cx="16" cy="15" r="3.5" class="dot-cyan"/>
          <text x="30" y="19" class="font-mono chip-text">Next.js</text>
        </g>
        <!-- Chip 8 -->
        <g transform="translate(820, 0)">
          <rect width="105" height="30" rx="15" class="chip-bg"/>
          <circle cx="16" cy="15" r="3.5" class="dot-blue"/>
          <text x="30" y="19" class="font-mono chip-text">Docker</text>
        </g>
        <!-- Chip 9 -->
        <g transform="translate(935, 0)">
          <rect width="120" height="30" rx="15" class="chip-bg"/>
          <circle cx="16" cy="15" r="3.5" class="dot-purple"/>
          <text x="30" y="19" class="font-mono chip-text">PostgreSQL</text>
        </g>
        <!-- Chip 10 -->
        <g transform="translate(1065, 0)">
          <rect width="125" height="30" rx="15" class="chip-bg"/>
          <circle cx="16" cy="15" r="3.5" class="dot-cyan"/>
          <text x="30" y="19" class="font-mono chip-text">Kubernetes</text>
        </g>
      </g>

      <!-- Set 2 (Identical Duplicate for continuous wrap) -->
      <g transform="translate(1210, 13)">
        <g transform="translate(0, 0)">
          <rect width="105" height="30" rx="15" class="chip-bg"/>
          <circle cx="16" cy="15" r="3.5" class="dot-cyan"/>
          <text x="30" y="19" class="font-mono chip-text">Python</text>
        </g>
        <g transform="translate(115, 0)">
          <rect width="95" height="30" rx="15" class="chip-bg"/>
          <circle cx="16" cy="15" r="3.5" class="dot-blue"/>
          <text x="30" y="19" class="font-mono chip-text">React</text>
        </g>
        <g transform="translate(220, 0)">
          <rect width="130" height="30" rx="15" class="chip-bg"/>
          <circle cx="16" cy="15" r="3.5" class="dot-purple"/>
          <text x="30" y="19" class="font-mono chip-text">Agentic AI</text>
        </g>
        <g transform="translate(360, 0)">
          <rect width="105" height="30" rx="15" class="chip-bg"/>
          <circle cx="16" cy="15" r="3.5" class="dot-cyan"/>
          <text x="30" y="19" class="font-mono chip-text">FastAPI</text>
        </g>
        <g transform="translate(475, 0)">
          <rect width="100" height="30" rx="15" class="chip-bg"/>
          <circle cx="16" cy="15" r="3.5" class="dot-blue"/>
          <text x="30" y="19" class="font-mono chip-text">.NET Core</text>
        </g>
        <g transform="translate(585, 0)">
          <rect width="110" height="30" rx="15" class="chip-bg"/>
          <circle cx="16" cy="15" r="3.5" class="dot-purple"/>
          <text x="30" y="19" class="font-mono chip-text">PyTorch</text>
        </g>
        <g transform="translate(705, 0)">
          <rect width="105" height="30" rx="15" class="chip-bg"/>
          <circle cx="16" cy="15" r="3.5" class="dot-cyan"/>
          <text x="30" y="19" class="font-mono chip-text">Next.js</text>
        </g>
        <g transform="translate(820, 0)">
          <rect width="105" height="30" rx="15" class="chip-bg"/>
          <circle cx="16" cy="15" r="3.5" class="dot-blue"/>
          <text x="30" y="19" class="font-mono chip-text">Docker</text>
        </g>
        <g transform="translate(935, 0)">
          <rect width="120" height="30" rx="15" class="chip-bg"/>
          <circle cx="16" cy="15" r="3.5" class="dot-purple"/>
          <text x="30" y="19" class="font-mono chip-text">PostgreSQL</text>
        </g>
        <g transform="translate(1065, 0)">
          <rect width="125" height="30" rx="15" class="chip-bg"/>
          <circle cx="16" cy="15" r="3.5" class="dot-cyan"/>
          <text x="30" y="19" class="font-mono chip-text">Kubernetes</text>
        </g>
      </g>
    </g>
  </g>
</svg>

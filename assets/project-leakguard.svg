<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBgLg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>

    <!-- Traveling Gradient Border -->
    <linearGradient id="travelGradLg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="borderGlowLg" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .p-title { font-size: 18px; font-weight: 800; fill: #f0f6fc; }
    .p-desc { font-size: 13.5px; fill: #c9d1d9; }
    .tag-txt { font-size: 11px; fill: #00d4ff; font-family: 'SF Mono', monospace; font-weight: 600; }

    @media (prefers-reduced-motion: reduce) {
      .travel-border { stroke-dashoffset: 0 !important; animation: none !important; }
    }
  </style>

  <!-- Base Card Panel -->
  <rect x="3" y="3" width="844" height="174" rx="12" fill="url(#cardBgLg)" stroke="#30363d" stroke-width="1"/>

  <!-- Traveling Border Animation (Perimeter ~ 2036) -->
  <rect x="3" y="3" width="844" height="174" rx="12" fill="none" stroke="url(#travelGradLg)" stroke-width="2" stroke-dasharray="180 840" stroke-dashoffset="0" class="travel-border" filter="url(#borderGlowLg)">
    <animate attributeName="stroke-dashoffset" values="0;-1020" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Left Accent Bar -->
  <rect x="3" y="15" width="4" height="150" rx="2" fill="#00d4ff"/>

  <!-- Header & Icon -->
  <g transform="translate(30, 24)">
    <!-- Project Icon Badge -->
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="18" y="24" text-anchor="middle" font-size="18">🛡️</text>

    <!-- Title -->
    <text x="48" y="24" class="font-sans p-title">LeakGuard</text>
    
    <!-- Category Pill -->
    <g transform="translate(165, 6)">
      <rect width="210" height="24" rx="12" fill="#0c2d48" stroke="#00d4ff" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#00d4ff"/>
      <text x="22" y="16" class="font-mono" font-size="10.5" fill="#00d4ff" font-weight="600">AST STATIC CODE ANALYZER</text>
    </g>
  </g>

  <!-- Description -->
  <g transform="translate(30, 78)">
    <text x="0" y="14" class="font-sans p-desc">
      An AST-based Python static analyzer engineered to detect potential resource and memory leaks prior to runtime.
    </text>
    <text x="0" y="34" class="font-sans p-desc">
      Features custom syntax tree visitors, automated PyTest suites, CLI inspection tooling, and CI workflow integration.
    </text>
  </g>

  <!-- Tech Tags Footer -->
  <g transform="translate(30, 134)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="70" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="35" y="16" text-anchor="middle" class="tag-txt">Python</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(78, 0)">
      <rect width="95" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="47" y="16" text-anchor="middle" class="tag-txt">Python AST</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(181, 0)">
      <rect width="65" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="32" y="16" text-anchor="middle" class="tag-txt">PyTest</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(254, 0)">
      <rect width="85" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="42" y="16" text-anchor="middle" class="tag-txt">CLI Tooling</text>
    </g>
    <!-- Tag 5 -->
    <g transform="translate(347, 0)">
      <rect width="105" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="52" y="16" text-anchor="middle" class="tag-txt">CI Workflows</text>
    </g>

    <!-- Repositories Link Indicator -->
    <text x="790" y="16" text-anchor="end" class="font-mono" font-size="11" fill="#8b949e">
      View in Repositories <tspan fill="#00d4ff">→</tspan>
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#070a1a"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="heroBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Shimmer Text Gradient -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff">
        <animate attributeName="stop-color" values="#00d4ff;#3b82f6;#a855f7;#00d4ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#00d4ff;#ffffff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#00d4ff;#3b82f6;#a855f7" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-mono { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform, animateMotion { animation: none !important; }
    }
  </style>

  <!-- Base Card Panel -->
  <rect x="4" y="4" width="842" height="252" rx="16" fill="url(#heroBg)" stroke="url(#heroBorder)" stroke-width="1.5"/>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#00d4ff" stroke-width="0.75">
    <line x1="4" y1="45" x2="846" y2="45"/>
    <line x1="4" y1="90" x2="846" y2="90"/>
    <line x1="4" y1="135" x2="846" y2="135"/>
    <line x1="4" y1="180" x2="846" y2="180"/>
    <line x1="4" y1="225" x2="846" y2="225"/>
    <line x1="100" y1="4" x2="100" y2="256"/>
    <line x1="250" y1="4" x2="250" y2="256"/>
    <line x1="400" y1="4" x2="400" y2="256"/>
    <line x1="550" y1="4" x2="550" y2="256"/>
    <line x1="700" y1="4" x2="700" y2="256"/>
  </g>

  <!-- Ambient Pulsing Glow Orbs -->
  <circle cx="200" cy="130" r="80" fill="#00d4ff" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="70;95;70" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="650" cy="130" r="85" fill="#a855f7" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="85;65;85" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.07;0.15" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating Particles -->
  <circle cx="120" cy="60" r="2" fill="#00d4ff" opacity="0.6">
    <animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="70" r="2.5" fill="#a855f7" opacity="0.6">
    <animate attributeName="cy" values="70;90;70" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="425" cy="40" r="1.8" fill="#3b82f6" opacity="0.7">
    <animate attributeName="cx" values="425;445;425" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="210" r="2" fill="#00d4ff" opacity="0.5">
    <animate attributeName="cy" values="210;195;210" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="200" r="2.2" fill="#a855f7" opacity="0.5">
    <animate attributeName="cy" values="200;220;200" dur="5.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Status Pill Badge Top -->
  <g transform="translate(425, 42)">
    <rect x="-170" y="-14" width="340" height="28" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <!-- Live Beacon -->
    <circle cx="-148" cy="0" r="4" fill="#00d4ff" filter="url(#subtleGlow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-136" y="4" fill="#00d4ff" font-size="11" font-weight="600" class="font-mono">STATUS:</text>
    <text x="-78" y="4" fill="#c9d1d9" font-size="11" class="font-mono">BUILDING INTELLIGENT SYSTEMS</text>
  </g>

  <!-- Main Hero Title -->
  <text x="425" y="125" text-anchor="middle" fill="url(#textShimmer)" font-size="44" font-weight="900" letter-spacing="4" class="font-sans" filter="url(#subtleGlow)">
    ADITYA PATIL
  </text>

  <!-- Tagline -->
  <text x="425" y="165" text-anchor="middle" fill="#8b949e" font-size="13.5" font-weight="500" letter-spacing="2" class="font-mono">
    FULL-STACK DEVELOPER <tspan fill="#00d4ff">•</tspan> AI/ML ENTHUSIAST <tspan fill="#3b82f6">•</tspan> AGENTIC AI EXPLORER
  </text>

  <!-- Bottom Interactive Focus Capsule -->
  <g transform="translate(425, 212)">
    <rect x="-240" y="-15" width="480" height="30" rx="15" fill="#0a0e27" stroke="url(#heroBorder)" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" fill="#f0f6fc" font-size="12" class="font-mono">
      <tspan fill="#00d4ff">&lt;</tspan> TURNING INNOVATIVE IDEAS INTO SCALABLE CODE <tspan fill="#a855f7">/&gt;</tspan>
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBgEf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </linearGradient>

    <!-- Traveling Gradient Border -->
    <linearGradient id="travelGradEf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>

    <filter id="borderGlowEf" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; }
    .p-title { font-size: 18px; font-weight: 800; fill: #f0f6fc; }
    .p-desc { font-size: 13.5px; fill: #c9d1d9; }
    .tag-txt { font-size: 11px; fill: #a855f7; font-family: 'SF Mono', monospace; font-weight: 600; }

    @media (prefers-reduced-motion: reduce) {
      .travel-border { stroke-dashoffset: 0 !important; animation: none !important; }
    }
  </style>

  <!-- Base Card Panel -->
  <rect x="3" y="3" width="844" height="174" rx="12" fill="url(#cardBgEf)" stroke="#30363d" stroke-width="1"/>

  <!-- Traveling Border Animation (Perimeter ~ 2036) -->
  <rect x="3" y="3" width="844" height="174" rx="12" fill="none" stroke="url(#travelGradEf)" stroke-width="2" stroke-dasharray="180 840" stroke-dashoffset="0" class="travel-border" filter="url(#borderGlowEf)">
    <animate attributeName="stroke-dashoffset" values="0;-1020" dur="6s" repeatCount="indefinite" begin="0.8s"/>
  </rect>

  <!-- Left Accent Bar -->
  <rect x="3" y="15" width="4" height="150" rx="2" fill="#a855f7"/>

  <!-- Header & Icon -->
  <g transform="translate(30, 24)">
    <!-- Project Icon Badge -->
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="18" y="24" text-anchor="middle" font-size="18">⚡</text>

    <!-- Title -->
    <text x="48" y="24" class="font-sans p-title">ElectroFlow / E-ScrapZone</text>
    
    <!-- Category Pill -->
    <g transform="translate(315, 6)">
      <rect width="215" height="24" rx="12" fill="#241438" stroke="#a855f7" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#a855f7"/>
      <text x="22" y="16" class="font-mono" font-size="10.5" fill="#a855f7" font-weight="600">CIRCULAR ECONOMY PLATFORM</text>
    </g>
  </g>

  <!-- Description -->
  <g transform="translate(30, 78)">
    <text x="0" y="14" class="font-sans p-desc">
      A comprehensive platform concept facilitating electronic reuse, certified device donations, and refurbished electronics exchange.
    </text>
    <text x="0" y="34" class="font-sans p-desc">
      Engineered with end-to-end full-stack workflows, inventory tracking, verified listings, and secure transaction management.
    </text>
  </g>

  <!-- Tech Tags Footer -->
  <g transform="translate(30, 134)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="65" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="32" y="16" text-anchor="middle" class="tag-txt">React</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(73, 0)">
      <rect width="75" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="37" y="16" text-anchor="middle" class="tag-txt">Node.js</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(156, 0)">
      <rect width="90" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="45" y="16" text-anchor="middle" class="tag-txt">Express.js</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(254, 0)">
      <rect width="85" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="42" y="16" text-anchor="middle" class="tag-txt">MongoDB</text>
    </g>
    <!-- Tag 5 -->
    <g transform="translate(347, 0)">
      <rect width="90" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="45" y="16" text-anchor="middle" class="tag-txt">REST APIs</text>
    </g>

    <!-- Repositories Link Indicator -->
    <text x="790" y="16" text-anchor="end" class="font-mono" font-size="11" fill="#8b949e">
      View in Repositories <tspan fill="#a855f7">→</tspan>
    </text>
  </g>
</svg>

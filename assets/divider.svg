<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 16" width="100%" height="16">
  <defs>
    <!-- Background Track Gradient -->
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="20%" stop-color="#30363d" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#30363d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>

    <!-- Moving Glow Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      .glow-beam { animation: none !important; }
    }
  </style>

  <!-- Static Track -->
  <line x1="10" y1="8" x2="840" y2="8" stroke="url(#trackGrad)" stroke-width="1.5"/>

  <!-- Center Diamond Accent -->
  <polygon points="425,3 430,8 425,13 420,8" fill="#00d4ff" opacity="0.8"/>

  <!-- Moving Glow Beam -->
  <g filter="url(#glowFilter)" class="glow-beam">
    <rect x="-200" y="6" width="220" height="4" rx="2" fill="url(#beamGrad)">
      <animate attributeName="x" values="-220;850" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
